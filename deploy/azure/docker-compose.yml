# Single-server production stack: the app + Postgres + Caddy (automatic HTTPS).
# Sized for a 1 GB VM (Azure for Students free B2ats v2) with swap enabled.
#
#   cd deploy/azure && sudo docker compose up -d --build
#
# Settings come from deploy/azure/.env (created by setup.sh, never committed).
services:
  app:
    build: ../..
    restart: unless-stopped
    env_file: .env
    environment:
      ENV: production
      APP_URL: https://${DOMAIN}
      DATABASE_URL: postgresql://tejaskrit:${POSTGRES_PASSWORD}@db:5432/tejaskrit
      # One answer analysis at a time keeps peak memory near 550 MB.
      ANALYSIS_WORKERS: "1"
    volumes:
      # Recordings waiting for background analysis must survive a restart.
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    command: postgres -c shared_buffers=32MB -c max_connections=30
    environment:
      POSTGRES_USER: tejaskrit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tejaskrit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tejaskrit -d tejaskrit"]
      interval: 5s
      timeout: 5s
      retries: 20

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  appdata:
  pgdata:
  caddy_data:
  caddy_config:
